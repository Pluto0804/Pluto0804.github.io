<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天气数据可视化平台</title>
  <script src="js/echarts.min.js"></script>
  <script src="js/d3.v3.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    /* 顶部装饰 */
    .top-shell {
      padding: 6px 6px 0;
      background: #0a0f1a;
    }

    .header {
      height: 48px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      box-shadow: inset 0 -10px 0 rgba(0, 0, 0, 0.2);
    }

    .header:before,
    .header:after {
      content: "";
      position: absolute;
      bottom: -8px;
      width: 235px;
      height: 16px;
      opacity: 0.5;
      background: repeating-linear-gradient(135deg, #334155 0 2px, transparent 2px 5px);
      clip-path: polygon(10% 0, 100% 0, 85% 100%, 0 100%);
    }

    .header:before {
      left: 170px;
    }

    .header:after {
      right: 170px;
      transform: scaleX(-1);
    }

    .header-title {
      position: relative;
      z-index: 1;
      font-size: 16px;
      font-weight: 600;
      color: white;
      letter-spacing: 2px;
    }

    /* Tab 导航栏 */
    .nav-bar {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px 24px 8px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .nav-btn {
      padding: 8px 24px;
      font-size: 14px;
      font-weight: 600;
      background: transparent;
      border: 1px solid #475569;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      border-color: #60a5fa;
      color: #60a5fa;
    }

    .nav-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* 页面容器 */
    .page-container {
      display: block;
      padding: 20px 24px;
    }

    /* Tab1 样式（深色版） */
    .tab1-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .tab1-container h1 {
      text-align: center;
      margin-bottom: 30px;
      color: white;
      font-size: 24px;
      font-weight: 600;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .chart-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .chart-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .chart-card h3 {
      margin-bottom: 16px;
      color: white;
      font-size: 18px;
      border-left: 4px solid #3b82f6;
      padding-left: 12px;
    }

    .chart-container {
      width: 100%;
      height: 400px;
      overflow: auto;
      overflow-x: hidden;
    }

    .full-width {
      grid-column: span 2;
    }

    .table-wrapper {
      overflow-x: auto;
      max-height: 450px;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      border: 1px solid #334155;
      padding: 10px 8px;
      text-align: center;
      color: white; 
    }

    th {
      background: #0f172a;
      color: white;
      position: sticky;
      top: 0;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background: #16202e;
    }

    tr:hover {
      background: #1e2a3a;
    }

    .select-wrapper {
      margin-left: 20px;
      display: inline-block;
    }

    select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    select:hover {
      border-color: #60a5fa;
    }

    @media (max-width: 900px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
      .full-width {
        grid-column: span 1;
      }
    }

    /* Tab2 样式 */
    .tab2-container {
      display: grid;
      grid-template-columns: 340px minmax(720px, 1fr);
      gap: 16px;
    }

    .left-panel {
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .city-title {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: white;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }

    .city-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .city-btn, .mini-btn {
      height: 32px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .city-btn:hover, .mini-btn:hover {
      border-color: #60a5fa;
      color: #60a5fa;
    }

    .city-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }

    .calendar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0 8px;
    }

    .calendar-title {
      font-size: 16px;
      font-weight: 600;
      color: white;
    }

    .calendar-controls {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      height: 28px;
      padding: 0 12px;
      font-size: 12px;
    }

    .date-selects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .date-selects select {
      width: 100%;
      padding: 8px;
    }

    .week-row, .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .week-row {
      margin-bottom: 8px;
      color: white;
      font-weight: 600;
      padding-bottom: 6px;
      border-bottom: 1px solid #334155;
    }

    .day-cell {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
    }

    .day-cell.muted {
      color: #475569;
      cursor: default;
    }

    .day-cell:not(.muted):hover {
      background: #334155;
      color: #60a5fa;
    }

    .day-cell.selected {
      background: #3b82f6;
      color: white;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .chart-panel, .wide-panel {
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      padding: 16px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 600;
      color: white;
    }

    .month-select {
      padding: 6px 10px;
      width: 110px;
    }

    .chart {
      width: 100%;
      height: 260px;
    }

    .wide-panel .chart {
      height: 280px;
    }

    .hint {
      margin-top: 10px;
      padding: 8px 12px;
      font-size: 12px;
      color: white;
      background: #0f172a;
      border-radius: 6px;
      display: none;
    }

    .hint.show {
      display: block;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.95);
      color: white;
      font-weight: 600;
      z-index: 1000;
    }

    .loading.hidden {
      display: none;
    }

    @media (max-width: 1050px) {
      .tab2-container {
        grid-template-columns: 1fr;
      }
      .top-charts {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">正在加载数据...</div>

  <div class="top-shell">
    <header class="header">
      <div class="header-title">天气数据可视化平台</div>
    </header>
  </div>

  <!-- Tab 导航 -->
  <div class="nav-bar">
    <button class="nav-btn active" data-tab="tab1">平均情况总览</button>
    <button class="nav-btn" data-tab="tab2">各省详情</button>
    <button class="nav-btn" data-tab="tab3">全球视野</button>
  </div>

  <!-- Tab1：平均情况总览 -->
  <div id="tab1" class="page-container tab1-container">
    <h1>省会城市平均情况总览（2025年5月 - 2026年5月）</h1>
    <div class="chart-grid">
      <div class="chart-card full-width">
        <h3>各省空气指数平均值总览（点击省份查看AQI）</h3>
        <div id="mapChart" class="chart-container"></div>
      </div>
      <div class="chart-card">
        <h3>各省平均温度总览</h3>
        <div id="lineChart" class="chart-container"></div>
      </div>
      <div class="chart-card">
        <h3>天气情况占比（点击查看城市列表）</h3>
        <div id="pieChart" class="chart-container"></div>
      </div>
      <!-- 修改第359-368行附近的雷达图卡片 -->
      <div class="chart-card full-width">
        <h3>风向统计
          <span class="select-wrapper">
            <select id="citySelect"></select>
          </span>
        </h3>
        <!-- 为雷达图设置固定高度并允许垂直滚动 -->
         <div style="height: 500px; overflow-y: auto; overflow-x: hidden;">
          <div id="radarChart" style="min-height: 500px; width: 100%;"></div>
        </div>
      </div>
      <div class="chart-card full-width">
        <h3>省会城市平均数据总览</h3>
        <div class="table-wrapper">
          <table id="dataTable">
            <thead><tr><th>城市</th><th>平均最高温(°C)</th><th>平均最低温(°C)</th><th>平均AQI</th><th>数据天数</th><th>天气分布</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab2：各省详情 -->
  <div id="tab2" class="page-container tab2-container" style="display: none;">
    <aside class="left-panel">
      <h1 class="city-title" id="summaryTitle">上海天气数据</h1>
      <div><div class="city-grid" id="cityGrid"></div></div>
      <div>
        <div class="date-selects">
          <select id="yearSelect"></select>
          <select id="monthSelect"></select>
        </div>
        <div class="calendar-head">
          <div class="calendar-title" id="calendarTitle">2026年5月</div>
          <div class="calendar-controls">
            <button class="mini-btn" id="prevMonth">◀ 上月</button>
            <button class="mini-btn" id="nextMonth">下月 ▶</button>
          </div>
        </div>
        <div class="week-row"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
        <div class="days-grid" id="daysGrid"></div>
      </div>
    </aside>
    <section class="right-panel">
      <div class="top-charts">
        <section class="chart-panel">
          <div class="panel-head">
            <div class="panel-title" id="tempTitle">温度变化图</div>
            <select class="month-select synced-month"></select>
          </div>
          <div class="chart" id="tempChart"></div>
        </section>
        <section class="chart-panel">
          <div class="panel-head">
            <div class="panel-title" id="airPieTitle">空气情况占比</div>
            <select class="month-select synced-month"></select>
          </div>
          <div class="chart" id="airPieChart"></div>
          <div class="hint" id="pieHint"></div>
        </section>
      </div>
      <section class="wide-panel">
        <div class="panel-head">
          <div class="panel-title" id="aqiTitle">空气指数变化</div>
          <select class="month-select synced-month"></select>
        </div>
        <div class="chart" id="aqiChart"></div>
        <div class="hint" id="aqiHint"></div>
      </section>
    </section>
  </div>

  <!-- Tab3：全球视野 -->
<div id="tab3" class="page-container" style="display: none; padding: 0; overflow: hidden;">
  <iframe src="global_vision.html" style="width: 100%; height: calc(100vh - 120px); border: none; border-radius: 12px;"></iframe>
</div>

  <script>
    // ==================== 全局变量 ====================
    let cityData = [];
    let activeTab = 'tab1';

    // 城市名称映射
    const cityNameMap = {
      '北京': '北京市', '上海': '上海市', '天津': '天津市', '重庆': '重庆市',
      '香港': '香港特别行政区', '澳门': '澳门特别行政区', '台北': '台湾省',
      '石家庄': '河北省', '太原': '山西省', '呼和浩特': '内蒙古自治区',
      '沈阳': '辽宁省', '长春': '吉林省', '哈尔滨': '黑龙江省',
      '南京': '江苏省', '杭州': '浙江省', '合肥': '安徽省', '福州': '福建省',
      '南昌': '江西省', '济南': '山东省', '郑州': '河南省', '武汉': '湖北省',
      '长沙': '湖南省', '广州': '广东省', '南宁': '广西壮族自治区',
      '海口': '海南省', '成都': '四川省', '贵阳': '贵州省', '昆明': '云南省',
      '拉萨': '西藏自治区', '西安': '陕西省', '兰州': '甘肃省',
      '西宁': '青海省', '银川': '宁夏回族自治区', '乌鲁木齐': '新疆维吾尔自治区'
    };

    // ==================== Tab2 变量 ====================
    const ordinaryFiles = [
  "国内data/weather_data2505.csv", "国内data/weather_data2506.csv", 
  "国内data/weather_data2507.csv", "国内data/weather_data2508.csv",
  "国内data/weather_data2509.csv", "国内data/weather_data2510.csv", 
  "国内data/weather_data2511.csv", "国内data/weather_data2512.csv",
  "国内data/weather_data2601.csv", "国内data/weather_data2602.csv", 
  "国内data/weather_data2603.csv", "国内data/weather_data2604.csv",
  "国内data/weather_data2605.csv"
];
    const specialFiles = [
      "国内data/weather_香港_202505-202605.csv",
      "国内data/weather_澳门_202505-202605.csv",
      "国内data/weather_台北_202505-202605.csv"
    ];
    const cityOrder = [
      "哈尔滨", "西宁", "兰州", "银川", "石家庄", "太原", "长春", "沈阳",
      "天津", "济南", "拉萨", "成都", "昆明", "西安", "郑州", "武汉",
      "重庆", "长沙", "贵阳", "南京", "合肥", "上海", "杭州", "南昌",
      "福州", "广州", "南宁", "台北", "海口", "其他"
    ];
    const extraCities = ["北京", "呼和浩特", "乌鲁木齐", "香港", "澳门"];
    const airLevels = ["优", "良好", "轻度污染", "中度污染", "重度污染"];
    const airColors = {
      "优": "#3b82f6", "良好": "#34d399", "轻度污染": "#fbbf24",
      "中度污染": "#f97316", "重度污染": "#8b5cf6", "无数据": "#475569"
    };

    const state2 = {
      rows: [], city: "上海", year: 2026, month: 5, day: null,
      latestDate: "2026-05-31", otherOpen: false
    };

    let charts = {};

    // ==================== Tab1 函数 ====================
    async function loadTab1Data() {
      const response = await fetch('city_average_data.json');
      if (!response.ok) throw new Error('city_average_data.json 加载失败');
      cityData = await response.json();
      console.log(`Tab1数据加载成功，共 ${cityData.length} 个城市`);
    }

    function initMapChart() {
      const mapData = cityData.map(city => {
        let mapName = cityNameMap[city.name];
        if (!mapName && city.name.includes('香港')) mapName = '香港特别行政区';
        if (!mapName && city.name.includes('澳门')) mapName = '澳门特别行政区';
        if (!mapName && city.name.includes('台北')) mapName = '台湾省';
        if (!mapName) mapName = city.name;
        return { name: mapName, value: city.aqi, originalName: city.name, maxTemp: city.maxTemp, minTemp: city.minTemp, dataDays: city.dataDays };
      });
      const chart = echarts.init(document.getElementById('mapChart'));
      chart.setOption({
        tooltip: { trigger: 'item', formatter: params => params.data ? `${params.name}<br/>平均AQI: ${params.data.value}<br/>最高温: ${params.data.maxTemp}°C<br/>最低温: ${params.data.minTemp}°C` : `${params.name}<br/>暂无数据` },
        visualMap: { min: 30, max: 100, calculable: true, inRange: { color: ['#5eb95e', '#f0ad4e', '#d9534f'] } ,textStyle: { color: '#ffffff' }},
        series: [{ type: 'map', map: 'china', roam: true, zoom: 1.2, label: { show: true, color: '#ffffff', fontSize: 10 }, data: mapData }]
      });
      chart.on('click', params => { if (params.data) alert(`${params.data.originalName || params.name}\n平均AQI: ${params.data.value}\n平均最高温: ${params.data.maxTemp}°C\n平均最低温: ${params.data.minTemp}°C`); });
    }

    function initLineChart() {
      const chart = echarts.init(document.getElementById('lineChart'));
      chart.setOption({
        tooltip: { trigger: 'axis' }, legend: { data: ['最高温', '最低温'], textStyle: { color: '#ffffff' } },
        dataZoom: [{ type: 'slider', start: 0, end: 30 }],
        xAxis: { type: 'category', data: cityData.map(c => c.name), axisLabel: { rotate: 45, color: '#ffffff' } },
        yAxis: { type: 'value', name: '温度(°C)', axisLabel: { color: '#ffffff' } },
        series: [{ name: '最高温', type: 'line', data: cityData.map(c => c.maxTemp), color: '#60a5fa' }, { name: '最低温', type: 'line', data: cityData.map(c => c.minTemp), color: '#f97316' }]
      });
    }

    function initPieChart() {
      let total = { 晴: 0, 多云: 0, 雨: 0, 雪: 0 };
      cityData.forEach(c => { total.晴 += c.weather.晴 || 0; total.多云 += c.weather.多云 || 0; total.雨 += c.weather.雨 || 0; total.雪 += c.weather.雪 || 0; });
      const chart = echarts.init(document.getElementById('pieChart'));
      chart.setOption({
        tooltip: { trigger: 'item' }, legend: { orient: 'vertical', left: 'left', textStyle: { color: '#ffffff' } },
        series: [{ type: 'pie', radius: '55%', data: [{ name: '晴', value: total.晴, itemStyle: { color: '#fbbf24' } }, { name: '多云', value: total.多云, itemStyle: { color: '#94a3b8' } }, { name: '雨', value: total.雨, itemStyle: { color: '#60a5fa' } }, { name: '雪', value: total.雪, itemStyle: { color: '#cbd5e1' } }] }]
      });
      chart.on('click', params => { const cities = cityData.filter(c => (c.weather[params.name] || 0) > 0).map(c => c.name); alert(`${params.name}天气城市：${cities.join('、')}`); });
    }

// ==================== 雷达图相关函数 ====================

function initRadarChart() {
  // 获取雷达图容器并设置样式（支持滚动）
  const radarContainer = document.getElementById('radarChart');
  radarContainer.style.height = '500px';
  radarContainer.style.overflowY = 'auto';
  radarContainer.style.overflowX = 'hidden';
  
  // 创建内层图表容器（让图表高度大于外层，产生滚动条）
  const innerDiv = document.createElement('div');
  innerDiv.id = 'radarChartInner';
  innerDiv.style.height = '800px';
  innerDiv.style.width = '100%';
  radarContainer.innerHTML = '';
  radarContainer.appendChild(innerDiv);
  
  // 初始化图表
  charts.radar = echarts.init(innerDiv);
  
  const select = document.getElementById('citySelect');
  cityData.forEach(c => { 
    const opt = document.createElement('option'); 
    opt.value = c.name; 
    opt.text = c.name; 
    select.appendChild(opt); 
  });
  select.onchange = () => updateRadar(select.value);
  if (cityData.length) updateRadar(cityData[0].name);
}

function updateRadar(cityName) {
  const city = cityData.find(c => c.name === cityName);
  if (!city) return;
  
  charts.radar.setOption({
    radar: { 
      indicator: [
        { name: '北风', max: 80 }, 
        { name: '东北风', max: 80 }, 
        { name: '东风', max: 80 }, 
        { name: '东南风', max: 80 }, 
        { name: '南风', max: 80 }, 
        { name: '西南风', max: 80 }, 
        { name: '西风', max: 80 }, 
        { name: '西北风', max: 80 }
      ], 
      shape: 'circle', 
      name: { textStyle: { color: '#ffffff' } },
      center: ['50%', '50%'],
      radius: '40%'
    },
    series: [{ 
      type: 'radar', 
      data: [{ 
        value: [city.wind.北 || 0, city.wind.东北 || 0, city.wind.东 || 0, 
                city.wind.东南 || 0, city.wind.南 || 0, city.wind.西南 || 0, 
                city.wind.西 || 0, city.wind.西北 || 0], 
        name: cityName 
      }], 
      areaStyle: { color: 'rgba(59,130,246,0.3)' }, 
      lineStyle: { color: '#3498db' },
      roam: true,           // 启用缩放平移
      scaleLimit: {         // 限制缩放范围
        min: 0.5,
        max: 2
      }
    }]
  });
  
  // 确保图表适应容器
  setTimeout(() => charts.radar.resize(), 50);
}

    function initDataTable() {
      const tbody = document.querySelector('#dataTable tbody');
      cityData.forEach(city => {
        const total = city.weather.晴 + city.weather.多云 + city.weather.雨 + city.weather.雪;
        const row = `<tr><td>${city.name}</td><td>${city.maxTemp.toFixed(1)}</td><td>${city.minTemp.toFixed(1)}</td><td>${city.aqi || 'N/A'}</td><td>${city.dataDays}</td><td>☀️${((city.weather.晴/total)*100).toFixed(1)}% ⛅${((city.weather.多云/total)*100).toFixed(1)}% 🌧️${((city.weather.雨/total)*100).toFixed(1)}%</td></tr>`;
        tbody.insertAdjacentHTML('beforeend', row);
      });
    }

    // ==================== Tab2 函数 ====================
    function mapRow(d) {
      const row = {};
      for (let key in d) {
        if (d.hasOwnProperty(key)) {
          const cleanKey = key.trim();
          const val = d[key] ? d[key].trim() : "";
          if (cleanKey === "date") row.date = val;
          else if (cleanKey === "city") row.city = val;
          else if (cleanKey === "max_temperature" || cleanKey === "最高温") row.max_temperature = Number(val);
          else if (cleanKey === "min_temperature" || cleanKey === "最低温") row.min_temperature = Number(val);
          else if (cleanKey === "weather_condition") row.weather_condition = val;
          else if (cleanKey === "wind_info") row.wind_info = val;
          else if (cleanKey === "air_quality_index") row.air_quality_index = val === "" ? null : Number(val);
          else if (cleanKey === "air_quality_status") row.air_quality_status = val === "良" ? "良好" : val;
        }
      }
      if (isNaN(row.max_temperature)) row.max_temperature = 0;
      if (isNaN(row.min_temperature)) row.min_temperature = 0;
      if (row.air_quality_index === undefined) row.air_quality_index = null;
      return row;
    }

    async function loadDetailData() {
      const files = ordinaryFiles.concat(specialFiles);
      return new Promise((resolve, reject) => {
        let results = new Array(files.length);
        let completed = 0;
        files.forEach((file, idx) => {
          d3.csv("./" + encodeURI(file), function(error, rawData) {
            if (error) { reject(new Error(file + " 读取失败")); return; }
            results[idx] = rawData.map(mapRow);
            completed++;
            if (completed === files.length) {
              state2.rows = results.flat();
              const dates = state2.rows.map(row => row.date).filter(Boolean).sort();
              state2.latestDate = dates[dates.length - 1] || state2.latestDate;
              resolve();
            }
          });
        });
      });
    }

    function monthKey(row) { return row.date.slice(0, 7); }
    function pad(n) { return String(n).padStart(2, "0"); }
    function availableMonths() { return [...new Set(state2.rows.map(row => monthKey(row)))].sort(); }
    function monthRows() { const key = `${state2.year}-${pad(state2.month)}`; return state2.rows.filter(row => row.city === state2.city && monthKey(row) === key).sort((a, b) => a.date.localeCompare(b.date)); }
    
    function statusForRow(row) {
      if (row.air_quality_status) {
        const map = { "优": "优", "良": "良好", "轻度": "轻度污染", "中度": "中度污染", "重度": "重度污染" };
        if (map[row.air_quality_status]) return map[row.air_quality_status];
      }
      if (row.air_quality_index == null) return "";
      if (row.air_quality_index <= 50) return "优";
      if (row.air_quality_index <= 100) return "良好";
      if (row.air_quality_index <= 150) return "轻度污染";
      if (row.air_quality_index <= 200) return "中度污染";
      return "重度污染";
    }

    function selectedMark(rows, field) {
      if (!state2.day) return [];
      const row = rows.find(r => Number(r.date.slice(8, 10)) === state2.day);
      if (!row || row[field] == null) return [];
      return [{ name: `${state2.day}日`, xAxis: `${state2.day}号`, yAxis: row[field] }];
    }

    function renderCities() {
      const grid = document.getElementById("cityGrid");
      if (!grid) return;
      grid.innerHTML = "";
      cityOrder.slice(0, -1).forEach(city => {
        const btn = document.createElement("button");
        btn.className = "city-btn" + (state2.city === city ? " active" : "");
        btn.textContent = city;
        btn.onclick = () => { state2.city = city; state2.day = null; renderDetailAll(); };
        grid.appendChild(btn);
      });
      const other = document.createElement("button");
      other.className = "city-btn" + (extraCities.includes(state2.city) ? " active" : "");
      other.textContent = state2.otherOpen ? "收起" : "其他";
      other.onclick = () => { state2.otherOpen = !state2.otherOpen; renderCities(); };
      grid.appendChild(other);
      if (state2.otherOpen || extraCities.includes(state2.city)) {
        extraCities.forEach(city => {
          const btn = document.createElement("button");
          btn.className = "city-btn" + (state2.city === city ? " active" : "");
          btn.textContent = city;
          btn.onclick = () => { state2.city = city; state2.day = null; renderDetailAll(); };
          grid.appendChild(btn);
        });
      }
    }

    function renderDetailSelects() {
      const months = availableMonths();
      const years = [...new Set(months.map(m => Number(m.slice(0, 4))))];
      const yearSel = document.getElementById("yearSelect");
      const monthSel = document.getElementById("monthSelect");
      if (!yearSel) return;
      yearSel.innerHTML = years.map(y => `<option value="${y}">${y}年</option>`).join("");
      yearSel.value = state2.year;
      const monthOpts = months.filter(m => Number(m.slice(0, 4)) === state2.year).map(m => Number(m.slice(5, 7)));
      monthSel.innerHTML = monthOpts.map(m => `<option value="${m}">${m}月</option>`).join("");
      monthSel.value = state2.month;
      yearSel.onchange = () => { state2.year = Number(yearSel.value); const first = availableMonths().find(m => Number(m.slice(0, 4)) === state2.year); state2.month = first ? Number(first.slice(5, 7)) : state2.month; state2.day = null; renderDetailAll(); };
      monthSel.onchange = () => { state2.month = Number(monthSel.value); state2.day = null; renderDetailAll(); };
      document.querySelectorAll(".synced-month").forEach(sel => {
        sel.innerHTML = monthOpts.map(m => `<option value="${m}">${m}月</option>`).join("");
        sel.value = state2.month;
        sel.onchange = () => { state2.month = Number(sel.value); state2.day = null; renderDetailAll(); };
      });
    }

    function renderCalendar() {
      const title = document.getElementById("calendarTitle");
      const grid = document.getElementById("daysGrid");
      if (!title) return;
      title.textContent = `${state2.year}年${state2.month}月`;
      grid.innerHTML = "";
      const first = new Date(state2.year, state2.month - 1, 1);
      const firstOffset = (first.getDay() + 6) % 7;
      const days = new Date(state2.year, state2.month, 0).getDate();
      const prevDays = new Date(state2.year, state2.month - 1, 0).getDate();
      const dataDays = new Set(monthRows().map(r => Number(r.date.slice(8, 10))));
      for (let i = 0; i < 42; i++) {
        const cell = document.createElement("div");
        cell.className = "day-cell";
        let label = i - firstOffset + 1;
        if (i < firstOffset) { cell.textContent = prevDays - firstOffset + i + 1; cell.classList.add("muted"); }
        else if (label > days) { cell.textContent = label - days; cell.classList.add("muted"); }
        else { cell.textContent = label; if (!dataDays.has(label)) cell.classList.add("muted"); if (state2.day === label) cell.classList.add("selected"); if (dataDays.has(label)) cell.onclick = () => { state2.day = state2.day === label ? null : label; renderDetailAll(); }; }
        grid.appendChild(cell);
      }
    }

    function updateTitles() {
      const latest = state2.latestDate.split("-");
      document.getElementById("summaryTitle").textContent = `${state2.city}天气分析 截止：${latest[0]}年${latest[1]}月`;
      document.getElementById("tempTitle").textContent = `${state2.city}温度${state2.month}月变化`;
      document.getElementById("airPieTitle").textContent = `${state2.city}空气${state2.month}月占比`;
      document.getElementById("aqiTitle").textContent = `${state2.city}空气指数${state2.month}月`;
    }

    function drawTemp(rows) {
      if (!charts.tempChart) charts.tempChart = echarts.init(document.getElementById("tempChart"));
      const days = rows.map(r => `${Number(r.date.slice(8, 10))}号`);
      charts.tempChart.setOption({
        tooltip: { trigger: "axis" }, legend: { textStyle: { color: "#ffffff" } },
        dataZoom: [{ type: "slider", start: 0, end: rows.length > 20 ? 62 : 100 }],
        xAxis: { type: "category", data: days, axisLabel: { color: "#ffffff" } },
        yAxis: { type: "value", axisLabel: { color: "#ffffff" }, splitLine: { lineStyle: { color: "#334155" } } },
        series: [{ name: "最高温", type: "line", data: rows.map(r => r.max_temperature), color: "#60a5fa", markPoint: { data: selectedMark(rows, "max_temperature") } }, { name: "最低温", type: "line", data: rows.map(r => r.min_temperature), color: "#f97316", markPoint: { data: selectedMark(rows, "min_temperature") } }]
      });
    }

    function drawPie(rows) {
    if (!charts.pieChart) charts.pieChart = echarts.init(document.getElementById("airPieChart"));
    const valid = rows.filter(r => r.air_quality_index != null);
    if (!valid.length) {
        charts.pieChart.setOption({
            series: [{
                type: "pie",
                data: [{ value: 1, name: "无数据" }],
                label: { show: false }
            }]
        });
        return;
    }
    const groups = { "优": [], "良好": [], "轻度污染": [], "中度污染": [], "重度污染": [] };
    valid.forEach(r => {
        const level = statusForRow(r);
        if (groups[level]) groups[level].push(Number(r.date.slice(8, 10)));
    });
    const data = airLevels.filter(l => groups[l].length).map(l => ({
        value: groups[l].length,
        name: l,
        itemStyle: { color: airColors[l] },
        days: groups[l]
    }));
    charts.pieChart.setOption({
        tooltip: {
            trigger: "item",
            formatter: function(params) {
                return params.name + "<br/>" + params.value + "天，占" + params.percent + "%";
            }
        },
        legend: {
            top: 0,
            left: "center",
            textStyle: { color: "#ffffff" }
        },
        series: [{
            type: "pie",
            radius: ["42%", "67%"],
            center: ["50%", "55%"],
            avoidLabelOverlap: true,
            itemStyle: { borderRadius: 5, borderWidth: 2 },
            label: {
                show: true,
                formatter: function(params) {
                    return params.name + "\n" + params.value + "天 " + params.percent + "%";
                },
                color: "#ffffff"
            },
            labelLine: { length: 12, length2: 8 },
            data: data
        }]
    });
    charts.pieChart.off("click");
    charts.pieChart.on("click", function(params) {
        const days = params.data.days || [];
        const hint = document.getElementById("pieHint");
        hint.textContent = params.name + "：" + days.map(function(day) { return day + "日"; }).join("、");
        hint.classList.add("show");
        setTimeout(function() { hint.classList.remove("show"); }, 3000);
    });
}

    function drawAqi(rows) {
    if (!charts.aqiChart) charts.aqiChart = echarts.init(document.getElementById("aqiChart"));
    const hint = document.getElementById("aqiHint");
    const hasAqi = rows.some(row => row.air_quality_index != null);
    if (!hasAqi) {
        hint.textContent = `${state2.city}空气指数数据缺失，空气指数图仅显示空状态。`;
        hint.classList.add("show");
    } else {
        hint.classList.remove("show");
    }
    const days = rows.map(row => `${Number(row.date.slice(8, 10))}号`);
    charts.aqiChart.setOption({
        tooltip: { trigger: "axis", axisPointer: { type: "shadow" } },
        grid: { left: 42, right: 28, top: 24, bottom: 52 },
        dataZoom: [{ type: "slider", height: 16, bottom: 10, start: 0, end: rows.length > 24 ? 74 : 100 }],
        xAxis: { type: "category", data: days, axisLine: { lineStyle: { color: "#cbd5e1" } }, axisLabel: { color: "#ffffff" } },
        yAxis: { type: "value", axisLabel: { color: "#ffffff" }, splitLine: { lineStyle: { color: "#334155" } } },
        series: [{
            name: "空气指数",
            type: "bar",
            barWidth: "38%",
            showBackground: true,
            backgroundStyle: { color: "rgba(180, 190, 205, 0.16)" },
            itemStyle: { color: "#1478e8", borderRadius: [2, 2, 0, 0] },
            data: rows.map(row => row.air_quality_index),
            markPoint: {
                symbolSize: 58,
                itemStyle: { color: "#ffffff" },
                data: selectedMark(rows, "air_quality_index")
            }
        }]
    }, true);
}

    function renderDetailAll() {
      const rows = monthRows();
      renderCities();
      renderDetailSelects();
      renderCalendar();
      updateTitles();
      drawTemp(rows);
      drawPie(rows);
      drawAqi(rows);
    }

    function bindDetailControls() {
      document.getElementById("prevMonth").onclick = () => {
        const months = availableMonths();
        const current = `${state2.year}-${pad(state2.month)}`;
        const idx = months.indexOf(current);
        if (idx > 0) {
          const prev = months[idx - 1].split("-");
          state2.year = parseInt(prev[0]);
          state2.month = parseInt(prev[1]);
          state2.day = null;
          renderDetailAll();
        }
      };
      document.getElementById("nextMonth").onclick = () => {
        const months = availableMonths();
        const current = `${state2.year}-${pad(state2.month)}`;
        const idx = months.indexOf(current);
        if (idx < months.length - 1) {
          const next = months[idx + 1].split("-");
          state2.year = parseInt(next[0]);
          state2.month = parseInt(next[1]);
          state2.day = null;
          renderDetailAll();
        }
      };
    }

    // ==================== Tab 切换 ====================
    function switchTab(tabId) {
      document.querySelectorAll('.page-container').forEach(container => container.style.display = 'none');
      document.getElementById(tabId).style.display = tabId === 'tab2' ? 'grid' : 'block';
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
      activeTab = tabId;
      if (tabId === 'tab1') setTimeout(() => { if (charts.radar) charts.radar.resize(); }, 100);
      if (tabId === 'tab2') setTimeout(() => { Object.values(charts).forEach(c => c && c.resize()); }, 100);
    }

    // ==================== 主入口 ====================
    async function init() {
      try {
        // 加载 Tab1 数据
        await loadTab1Data();
        
        // 加载地图
        const geoResp = await fetch('中华人民共和国.geojson');
        const geoJson = await geoResp.json();
        echarts.registerMap('china', geoJson);
        
        // 初始化 Tab1 图表
        initMapChart();
        initLineChart();
        initPieChart();
        initRadarChart();
        initDataTable();
        
        // 加载 Tab2 数据
        await loadDetailData();
        
        // 初始化 Tab2
        bindDetailControls();
        renderDetailAll();
        
        // Tab 切换绑定
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });
        
        document.getElementById('loading').classList.add('hidden');
      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = `❌ 加载失败: ${err.message}<br>请确保文件存在`;
      }
    }
    
    init();
  </script>
</body>
</html>
