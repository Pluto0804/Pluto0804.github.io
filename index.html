<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天气数据可视化</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #647087;
      --line: #d9e0ea;
      --blue: #2374ab;
      --green: #2d9d78;
      --yellow: #e6a737;
      --red: #d95d52;
      --shadow: 0 18px 50px rgba(36, 50, 73, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.6fr);
      gap: 24px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    .hero,
    .panel,
    .city-card {
      background: var(--panel);
      border: 1px solid rgba(217, 224, 234, 0.86);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: clamp(24px, 5vw, 54px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 310px;
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -30px -80px auto;
      width: 360px;
      height: 220px;
      background:
        radial-gradient(circle at 22% 52%, rgba(35, 116, 171, 0.2), transparent 24%),
        linear-gradient(135deg, rgba(45, 157, 120, 0.18), rgba(230, 167, 55, 0.2));
      transform: rotate(-8deg);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--blue);
      font-size: 0.92rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(2.4rem, 7vw, 5.4rem);
      line-height: 0.98;
      font-weight: 850;
    }

    .hero p {
      max-width: 650px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.75;
    }

    .current {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 310px;
    }

    .current h2,
    .panel h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .temperature {
      display: flex;
      align-items: start;
      gap: 10px;
      margin: 22px 0;
    }

    .temperature strong {
      font-size: clamp(4rem, 9vw, 6rem);
      line-height: 0.85;
    }

    .temperature span {
      color: var(--muted);
      font-weight: 700;
      padding-top: 10px;
    }

    .weather-note {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .metric {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcff;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 1.25rem;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
      gap: 24px;
      align-items: start;
    }

    .panel {
      padding: 24px;
    }

    .chart-wrap {
      width: 100%;
      height: 360px;
      margin-top: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcff;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .city-list {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .city-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      box-shadow: none;
    }

    .city-card h3 {
      margin: 0 0 6px;
      font-size: 1rem;
    }

    .city-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .city-card strong {
      font-size: 1.55rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(45, 157, 120, 0.12);
      color: var(--green);
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .footer-note {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    @media (max-width: 860px) {
      header,
      main {
        grid-template-columns: 1fr;
      }

      .metrics {
        grid-template-columns: 1fr;
      }

      .chart-wrap {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <section class="hero" aria-label="项目介绍">
        <div>
          <p class="eyebrow">Weather Dashboard</p>
          <h1>天气数据可视化</h1>
          <p>聚合城市天气概览、7 日温度趋势和核心气象指标，让天气变化更容易被观察、比较和理解。</p>
        </div>
      </section>

      <aside class="current panel" aria-label="当前天气">
        <div>
          <h2>今日概览 · 上海</h2>
          <div class="temperature">
            <strong>28</strong>
            <span>°C</span>
          </div>
          <p class="weather-note">多云转晴，体感温度适中，适合通勤和户外活动。</p>
        </div>
        <div class="metrics" aria-label="天气指标">
          <div class="metric">
            <span>湿度</span>
            <strong>62%</strong>
          </div>
          <div class="metric">
            <span>风速</span>
            <strong>12 km/h</strong>
          </div>
          <div class="metric">
            <span>AQI</span>
            <strong>42</strong>
          </div>
        </div>
      </aside>
    </header>

    <main>
      <section class="panel" aria-label="温度趋势">
        <h2>7 日温度趋势</h2>
        <div class="chart-wrap">
          <canvas id="temperatureChart" aria-label="7 日温度趋势折线图"></canvas>
        </div>
        <p class="footer-note">当前页面使用示例数据展示视觉效果，后续可接入真实天气 API 自动更新。</p>
      </section>

      <section class="panel" aria-label="城市对比">
        <h2>城市天气对比</h2>
        <div class="city-list">
          <article class="city-card">
            <div>
              <h3>北京</h3>
              <p>晴 · 湿度 38%</p>
            </div>
            <strong>31°C</strong>
          </article>
          <article class="city-card">
            <div>
              <h3>上海</h3>
              <p>多云 · 湿度 62%</p>
            </div>
            <strong>28°C</strong>
          </article>
          <article class="city-card">
            <div>
              <h3>广州</h3>
              <p>阵雨 · 湿度 79%</p>
            </div>
            <strong>30°C</strong>
          </article>
          <article class="city-card">
            <div>
              <h3>成都</h3>
              <p>阴 · 湿度 67%</p>
            </div>
            <strong>26°C</strong>
          </article>
        </div>
        <p class="footer-note"><span class="badge">示例数据</span></p>
      </section>
    </main>
  </div>

  <script>
    const canvas = document.getElementById("temperatureChart");
    const ctx = canvas.getContext("2d");
    const labels = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
    const highs = [27, 29, 31, 30, 28, 32, 33];
    const lows = [20, 21, 23, 22, 21, 24, 25];

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      drawChart(rect.width, rect.height);
    }

    function drawChart(width, height) {
      ctx.clearRect(0, 0, width, height);

      const padding = { top: 34, right: 28, bottom: 48, left: 48 };
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;
      const minValue = 18;
      const maxValue = 35;

      ctx.strokeStyle = "#d9e0ea";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#647087";
      ctx.font = "12px Arial";

      for (let i = 0; i <= 4; i += 1) {
        const y = padding.top + (chartHeight / 4) * i;
        const value = Math.round(maxValue - ((maxValue - minValue) / 4) * i);
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
        ctx.fillText(`${value}°`, 12, y + 4);
      }

      labels.forEach((label, index) => {
        const x = padding.left + (chartWidth / (labels.length - 1)) * index;
        ctx.fillText(label, x - 12, height - 18);
      });

      drawLine(highs, "#d95d52", minValue, maxValue, padding, chartWidth, chartHeight);
      drawLine(lows, "#2374ab", minValue, maxValue, padding, chartWidth, chartHeight);

      drawLegend(width);
    }

    function drawLine(values, color, minValue, maxValue, padding, chartWidth, chartHeight) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();

      values.forEach((value, index) => {
        const x = padding.left + (chartWidth / (values.length - 1)) * index;
        const y = padding.top + chartHeight - ((value - minValue) / (maxValue - minValue)) * chartHeight;

        if (index === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      });

      ctx.stroke();

      values.forEach((value, index) => {
        const x = padding.left + (chartWidth / (values.length - 1)) * index;
        const y = padding.top + chartHeight - ((value - minValue) / (maxValue - minValue)) * chartHeight;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    function drawLegend(width) {
      const items = [
        { label: "最高温", color: "#d95d52" },
        { label: "最低温", color: "#2374ab" }
      ];
      let x = width - 150;

      items.forEach((item) => {
        ctx.fillStyle = item.color;
        ctx.fillRect(x, 22, 18, 4);
        ctx.fillStyle = "#647087";
        ctx.font = "12px Arial";
        ctx.fillText(item.label, x + 26, 27);
        x += 74;
      });
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
